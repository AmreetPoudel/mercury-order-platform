# ---------------------------
# Upstream backend definition
# ---------------------------
upstream app_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;

    # good for later scale
    # server 127.0.0.1:8001 backup;
    keepalive 32;
}

# ---------------------------
# HTTP Server Block
# ---------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # -----------------------
    # Logging (debug-friendly)
    # -----------------------
    access_log /var/log/nginx/app_access.log main;
    error_log  /var/log/nginx/app_error.log warn;

    # Custom log format should exist in nginx.conf:
    # log_format main '$remote_addr - $remote_user [$time_local] '
    #                 '"$request" $status $body_bytes_sent '
    #                 '"$http_referer" "$http_user_agent" '
    #                 'rt=$request_time '
    #                 'uct=$upstream_connect_time '
    #                 'urt=$upstream_response_time '
    #                 'uht=$upstream_header_time '
    #                 'ua="$upstream_addr"';

    # -----------------------
    # Global proxy settings
    # -----------------------
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Critical for debugging distributed systems
    proxy_set_header X-Request-ID $request_id;

    # -----------------------
    # Timeouts (real-world safe defaults)
    # -----------------------
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # -----------------------
    # Buffering (important for performance + debugging)
    # -----------------------
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # If your app streams logs or SSE, you may later disable buffering:
    # proxy_buffering off;

    # -----------------------
    # Main routing
    # -----------------------
    location / {
        proxy_pass http://app_backend;

        # Retry logic (important for transient failures)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Prevent cached broken responses during failures
        proxy_intercept_errors on;
    }

    # -----------------------
    # Optional: health check endpoint passthrough
    # -----------------------
    location /health {
        access_log off;
        proxy_pass http://app_backend;
    }
}
