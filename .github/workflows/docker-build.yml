name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version tag (example: v1.0.0)"
        required: false

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # API IMAGE

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            aamreet/mercury-api:latest
            aamreet/mercury-api:${{ env.SHORT_SHA }}

      - name: Tag API Version
        if: ${{ github.event.inputs.version != '' }}
        run: |
          docker pull aamreet/mercury-api:${{ env.SHORT_SHA }}
          docker tag aamreet/mercury-api:${{ env.SHORT_SHA }} aamreet/mercury-api:${{ github.event.inputs.version }}
          docker push aamreet/mercury-api:${{ github.event.inputs.version }}

      # WORKER IMAGE

      - name: Build and Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            aamreet/mercury-worker:latest
            aamreet/mercury-worker:${{ env.SHORT_SHA }}

      - name: Tag Worker Version
        if: ${{ github.event.inputs.version != '' }}
        run: |
          docker pull aamreet/mercury-worker:${{ env.SHORT_SHA }}
          docker tag aamreet/mercury-worker:${{ env.SHORT_SHA }} aamreet/mercury-worker:${{ github.event.inputs.version }}
          docker push aamreet/mercury-worker:${{ github.event.inputs.version }}